{% extends 'base.html' %}

{% block title %}Forgot Password{% endblock %}

{% block content %}
    <h2>Forgot Password</h2>
    {% if error %}
        <p>{{ error }}</p>
    {% endif %}
    <form method="POST">
        {% csrf_token %}
        <label for="email">Email:</label>
        <input type="email" name="email" id="email" required>
        <button type="submit">Reset Password</button>
    </form>
{% endblock %}
