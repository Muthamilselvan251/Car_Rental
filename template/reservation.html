<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book-Now</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'bootstrap/css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'fontawesome/fontawesome/css/all.min.css' %}">
<!--    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<style>
    label{
    color: #f1faee;
    padding-top: 8px;
    }
    .back{
     padding: auto;
     font-size: 12px;
     box-sizing: border-box;
     border: 1px solid black;
     border-radius: 5px;
     box-shadow: 2px 6px 20px 5px #001d3d;
     background-color: #264653;
     margin-top: 7px;
     margin-left: 422px;
    }
    h3{
    color: #06d6a0;
    }
    .button{
    background-color: #29bf12;
    color: #fffcf2;
    }
    .fa{
    color: #ffffff;
    font-size: 20px;
    margin-left: 150px;
    margin-top: 12px;
    }
</style>
<body>
{% block content %}
{% load crispy_forms_tags %}
<div>
    <div class="col-md-offset-3 col-md-5 back">
        <form method='POST'>
            {% csrf_token %}
            <i class="fa fa-user text-center"><h4>PERSONAL INFORMATION</h4></i>
            <div class="form-group">
                <label>Name</label>
                <input type="text" class="form-control" required placeholder="Name" name = "name">
            </div>
            <div class="form-group">
                <label>Age</label>
                <input type="number" class="form-control"  required placeholder="Age" name = "age">
            </div>
            <div class="form-group">
                <label>Phone Number</label>
                <input type="number" class="form-control" required placeholder="Phone Number" name = "phonenumber">
            </div>
            <div class="form-group">
                <label>email</label>
                <input type="email" class="form-control" required placeholder="Email" name = "email">
            </div>
                <div class="form-group">
                    <label>Pick-up</label>
                    <input type="text" class="form-control" required placeholder="PickUp" name="pickup">
                </div>
                <div class="form-group">
                    <label>Drop-of</label>
                    <input type="text" class="form-control" required placeholder="DropOf" name="dropof">
                </div>
                <div class="form-group">
                    <label>Pick-Date</label>
                    <input type="date" class="form-control"  required name="pickdate">
                </div>
                <div class="form-group">
                     <label>Pick-time</label>
                     <input type="time" class="form-control" required placeholder="12:00AM" name ="picktime">
                </div>
                <div class="form-group">
                    <label>Drop-Date</label>
                    <input type="date" class="form-control" required name="dropdate">
                </div>
                <div class="form-group">
                    <label>Drop-time</label>
                    <input type="time" class="form-control input" required placeholder="12:00AM" name ="droptime">
                </div>
                <div class="form-group text-center">
                    <input type="submit" value="Reserve now" class="btn btn-primary button">
                </div>
        </form>
    </div>
</div>
</body>
{% endblock %}
</html>
</body>
</html>
