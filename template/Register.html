<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'bootstrap/css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'fontawesome/fontawesome/css/all.min.css' %}">
<!--    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <script  src="{% static 'jquery/jquery-3.7.1.min.js' %}"></script>
</head>
<style>
    label{
    font-size: 15px;
    padding: 2px;
    }
</style>
<body>
{% block content %}
{% load crispy_forms_tags %}
<div class="container-fluid" style="margin-top:5px;">
<div class="col-md-offset-4 col-md-4">
<h2 class="text-primary page-header text-center"> <i class="fa fa-users"></i>Registration</h2>
    <form method="POST">
        {% csrf_token %}
        {{form|crispy}}
        <input type="submit" class="btn btn-primary btn-block " value="Register" style="margin-top: 20px;" >
    </form>
    <p class="text-center" style="margin-top: 20px; font-size: 15px;">Already User ?  <a href="{% url 'login' %}" style="color: green;">Login Now</a> </p>
</div>
</div>
</body>
{% endblock %}
</html>
